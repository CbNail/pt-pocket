name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 备份源码
        run: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/

      - name: 生成 Android 平台目录
        run: flutter create . --org com.ptpocket --project-name pt_pocket --platforms android

      - name: 还原源码
        run: |
          rm -rf lib
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec.yaml pubspec.yaml

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pt-pocket-apk
          path: build/app/outputs/flutter-apk/app-release.apk
