name: Build APK

# 触发方式：
#   1) 推送到 v0.7.0 分支时自动构建
#   2) 在 GitHub 仓库的 Actions 页面手动 Run workflow（workflow_dispatch）
on:
  push:
    branches:
      - v0.7.0
  workflow_dispatch:

permissions:
  contents: read

env:
  # 国内镜像加速；如需改用官方源，删除下面两行即可
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # 本仓库为 monorepo，Flutter 工程位于 mobile/flutter_app
    defaults:
      run:
        working-directory: mobile/flutter_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platform-tools'
          accept-android-sdk-licenses: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

      # android/settings.gradle.kts 要求 local.properties 中存在 flutter.sdk
      - name: Write android/local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> android/local.properties
          cat android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pt-pocket-v0.7.0-apk
          path: mobile/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30